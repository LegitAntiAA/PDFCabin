# PDFCabin — one container, one port (8420).
#   Start:  docker compose up -d --build
#   Update: git pull && docker compose up -d --build
services:
  pdfcabin:
    build: .
    image: pdfcabin:latest
    ports:
      - "8420:8420"
    volumes:
      - ./docs:/docs
    restart: unless-stopped

    # Everything below is optional — uncomment only what you need.
    # environment:
    #   # Bearer token for /api/* and /mcp. Leaving it unset is acceptable only while
    #   # the service is reachable from this machine (localhost) alone; as soon as the
    #   # port is exposed beyond the machine (LAN / port forwarding / reverse proxy),
    #   # a token is REQUIRED. Use a long random string. See the security note
    #   # in the README (Quick start section).
    #   PDFCABIN_TOKEN: "change-me-to-a-long-random-string"
    #   # Donation addresses: the project author's wallets are already baked in as
    #   # app defaults, so the donate heart shows up out of the box. Forks: set
    #   # YOUR addresses here (env overrides the defaults) to collect donations
    #   # for your build.
    #   PDFCABIN_DONATE_BTC: ""
    #   PDFCABIN_DONATE_ETH: ""
    #   PDFCABIN_DONATE_TON: ""
    #   PDFCABIN_DONATE_USDT_TRC20: ""
