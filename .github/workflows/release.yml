name: Release

# Publishes the Docker image to GHCR when a version tag is pushed.
# After the first run, make the package public in the repo's package settings
# (GHCR container packages are private by default).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/pdfcabin
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.ref_name }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.ref_name }}"
