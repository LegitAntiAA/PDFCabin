name: Release

# Publishes the Docker image to GHCR when a version tag is pushed.
# After the first run, make the package public in the repo's package settings
# (GHCR container packages are private by default).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        # Image names must be lowercase: the login may contain capitals.
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pdfcabin"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_REF_NAME}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_REF_NAME}"
