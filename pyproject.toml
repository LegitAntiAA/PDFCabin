[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfcabin"
version = "0.1.0"
description = "Privacy-first, self-hosted PDF toolkit with a built-in MCP server."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PDFCabin contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.9",
    "pikepdf>=9",
    "ocrmypdf>=16",
    "pypdfium2>=4",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "reportlab>=4",
    "pillow>=10",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: long-running OCR tests (need tesseract with the configured languages)"]
